<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* Static-hosting adapter: gives the page the same db/user interface it gets inside Claude,
   backed by data.json (everyone) and this browser's storage (organizer mode only, ?organizer). */
(function () {
  const ORG = /(^|[?&])organizer(=|&|$)/.test(location.search);
  const KEY = 'credence-organizer-v1';
  const PUBLIC = [/^config\//, /^resolutions\//, /^public\//, /^revealed\//];
  const store = new Map();
  const listeners = [];
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const depth = p => p.split('/').length;
  const snapDoc = p => { const d = store.get(p); return { id: p.split('/').pop(), exists: d !== undefined, data: () => clone(d), metadata: { fromCache: false, hasPendingWrites: false } }; };
  const docsOf = c => [...store.keys()].filter(p => p.startsWith(c + '/') && depth(p) === depth(c) + 1).sort().map(snapDoc);
  const qsnap = c => { const docs = docsOf(c); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false } }; };
  const persist = () => { if (!ORG) return; try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(store))); } catch (e) { /* storage unavailable */ } };
  const notify = () => listeners.slice().forEach(l => { try { l.fn(l.kind === 'doc' ? snapDoc(l.path) : qsnap(l.path)); } catch (e) { console.error(e); } });
  const guard = () => { if (!ORG) throw { code: 'permission-denied', message: 'Only the organizer can change data on this site.' }; };
  const write = (p, d) => { guard(); store.set(p, clone(d)); persist(); notify(); };

  const db = {
    doc: p => ({ path: p, id: p.split('/').pop(),
      get: async () => snapDoc(p),
      set: async d => write(p, d),
      update: async d => write(p, { ...(store.get(p) || {}), ...d }),
      delete: async () => { guard(); store.delete(p); persist(); notify(); },
      onSnapshot: (fn) => { const l = { kind: 'doc', path: p, fn }; listeners.push(l); setTimeout(() => fn(snapDoc(p)), 0); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; } }),
    collection: c => ({ path: c,
      get: async () => qsnap(c),
      onSnapshot: (fn) => { const l = { kind: 'coll', path: c, fn }; listeners.push(l); setTimeout(() => fn(qsnap(c)), 0); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; },
      doc: id => db.doc(c + '/' + id) })
  };
  const user = {
    id: async () => ORG ? 'organizer' : 'visitor',
    canEdit: async () => ORG, isOwner: async () => ORG, can: async () => ORG,
    me: async () => ({ name: ORG ? 'Organizer' : '', id: ORG ? 'organizer' : 'visitor' })
  };

  const ready = (async () => {
    let flat = null;
    if (ORG) { try { const raw = localStorage.getItem(KEY); if (raw) flat = JSON.parse(raw); } catch (e) { flat = null; } }
    if (!flat) {
      try {
        const r = await fetch('data.json', { cache: 'no-store' });
        if (r.ok) flat = (await r.json()).docs || {};
      } catch (e) { flat = null; }
    }
    for (const k in (flat || {})) store.set(k, flat[k]);
  })();

  const download = (name, obj) => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  window.__HOSTED__ = {
    organizer: ORG,
    exportPublic() {
      const docs = {};
      for (const [k, v] of store) if (PUBLIC.some(r => r.test(k))) docs[k] = v;
      download('data.json', { generatedAt: new Date().toISOString(), docs });
      return Object.keys(docs).length;
    },
    exportBackup() { download('organizer-backup-PRIVATE.json', { generatedAt: new Date().toISOString(), docs: Object.fromEntries(store) }); },
    async importBackup(text) {
      const j = JSON.parse(text);
      if (!j || typeof j.docs !== 'object') throw new Error('That isn’t an organizer backup file.');
      store.clear(); for (const k in j.docs) store.set(k, j.docs[k]);
      persist(); notify(); return store.size;
    }
  };
  window.claude = { use: async name => { await ready; return name === 'db' ? db : name === 'user' ? user : null; } };
})();

</script>

<body>
<title>Credence Challenge</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: one narrow column with a sticky masthead; forecasting rows pair each statement with a
   probability box and a slider; results views are tables and a dot-strip per question. */
:root {
  --bg: #F2F5F8; --surface: #FFFFFF; --surface-2: #E8EDF2; --ink: #111B25; --ink-2: #4B5C6B; --line: #D3DBE3;
  --accent: #2447C8; --accent-ink: #FFFFFF; --accent-soft: #E3E9FB;
  --yes: #1B7A58; --yes-soft: #DCF1E7; --no: #B23B2B; --no-soft: #F7E1DC; --warn: #8A5A00; --warn-soft: #FBEBCB;
  --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1419; --surface: #151D25; --surface-2: #1F2A34; --ink: #E6EDF3; --ink-2: #9AAAB8; --line: #2B3844;
    --accent: #86A2FF; --accent-ink: #0B1220; --accent-soft: #1C2A52;
    --yes: #4CC38A; --yes-soft: #163A2C; --no: #F08A78; --no-soft: #42211C; --warn: #E0A64A; --warn-soft: #3A2C10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1419; --surface: #151D25; --surface-2: #1F2A34; --ink: #E6EDF3; --ink-2: #9AAAB8; --line: #2B3844;
  --accent: #86A2FF; --accent-ink: #0B1220; --accent-soft: #1C2A52;
  --yes: #4CC38A; --yes-soft: #163A2C; --no: #F08A78; --no-soft: #42211C; --warn: #E0A64A; --warn-soft: #3A2C10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Masthead */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-top: 14px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 24px; line-height: 1.1; letter-spacing: -0.01em; }
.brand p { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font: 600 11px var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.locked { background: var(--warn-soft); color: var(--warn); }
.pill.revealed { background: var(--yes-soft); color: var(--yes); }
.hcount { font: 500 13px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 10px 13px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.progress { padding: 10px 0 0; display: grid; gap: 6px; }
.progress-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ptext { font: 500 13px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.ptext b { font-weight: 600; }
.plink { font: 600 13px var(--font-body); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .2s; }
.bar.full i { background: var(--yes); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

.banner { margin-top: 14px; padding: 11px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); font-weight: 500; }
main { padding-top: 22px; display: grid; gap: 18px; }
main > section { display: grid; gap: 18px; align-content: start; min-width: 0; }
main > section[hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card > h2 { font-size: 20px; margin-bottom: 8px; }
.card > h3 { font-size: 16px; margin-bottom: 8px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Forms and buttons */
input[type=text], input[type=date], input[type=datetime-local], input[type=url], select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%;
}
input:disabled, select:disabled { opacity: .6; }
.btn { font: 600 14px var(--font-body); padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: 500 13px var(--font-body); cursor: pointer; }
.chip b { font: 500 12px var(--font-mono); color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] b { color: var(--bg); }
.note { padding: 11px 14px; border-radius: var(--radius); background: var(--surface-2); color: var(--ink); }

/* Forecast rows */
.sec { scroll-margin-top: 210px; }
.q { scroll-margin-top: 210px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px 6px; }
.sec-head h2 { font-size: 21px; }
.sec-count { font: 500 12px var(--font-mono); color: var(--ink-2); }
.sec-note { color: var(--ink-2); font-size: 13px; padding: 0 2px 8px; }
.sec-body { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 16px; }
.q { display: grid; grid-template-columns: 2.1rem minmax(0, 1fr) auto; grid-template-areas: "n t p" ". s s" ". o o"; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.q:first-child { border-top: 0; }
.qn { grid-area: n; font: 500 12px var(--font-mono); color: var(--ink-2); padding-top: 3px; }
.qt { grid-area: t; min-width: 0; }
.qm { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.pct { grid-area: p; display: flex; align-items: center; gap: 4px; align-self: start; font-family: var(--font-mono); color: var(--ink-2); }
.pin { width: 4.4rem; text-align: right; font: 500 16px var(--font-mono); font-variant-numeric: tabular-nums; padding: 6px 8px; border: 1px dashed var(--warn); border-radius: 8px; background: var(--surface); color: var(--ink); -moz-appearance: textfield; }
.pin::-webkit-outer-spin-button, .pin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.q.done .pin { border-style: solid; border-color: var(--line); }
.pin.bad { border-color: var(--no); color: var(--no); }
.qs { grid-area: s; padding-top: 4px; }
.po { grid-area: o; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 6px; font-size: 13px; color: var(--ink-2); }
.po .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

input[type=range] { width: 100%; height: 26px; background: transparent; -webkit-appearance: none; appearance: none; margin: 0; cursor: pointer; --fill: 0%; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--fill), var(--surface-2) var(--fill)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-2); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
input[type=range].unset::-webkit-slider-runnable-track { background: var(--surface-2); }
input[type=range].unset::-webkit-slider-thumb { border-color: var(--line); }
input[type=range].unset::-moz-range-progress { background: transparent; }
input[type=range].unset::-moz-range-thumb { border-color: var(--line); }
input[type=range]:disabled { cursor: default; opacity: .6; }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 11px var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-family: var(--font-mono); }
tr.me td { background: var(--accent-soft); }
.scale { position: relative; height: 6px; width: 96px; background: var(--surface-2); border-radius: 3px; display: inline-block; vertical-align: middle; margin-left: 10px; }
.scale::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink-2); }
.scale i { position: absolute; top: -3px; width: 10px; height: 12px; margin-left: -5px; border-radius: 3px; background: var(--accent); }
@media (max-width: 640px) { .scale { display: none; } }

.out { font: 600 11px var(--font-mono); padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
.out.yes { background: var(--yes-soft); color: var(--yes); }
.out.no { background: var(--no-soft); color: var(--no); }
.out.void { background: var(--surface-2); color: var(--ink-2); }
.list { display: grid; gap: 0; }
.item { display: grid; grid-template-columns: 2.1rem minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.item .qn { padding-top: 2px; }
.item .meta { font-size: 12px; color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }

/* Crowd */
.cq { border-top: 1px solid var(--line); }
.cq:first-child { border-top: 0; }
.cq > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 2.1rem minmax(0, 1fr) auto; gap: 6px 12px; padding: 14px 0; }
.cq > summary::-webkit-details-marker { display: none; }
.cq .stats { font: 500 12px var(--font-mono); color: var(--ink-2); text-align: right; white-space: nowrap; }
.cq .stats b { color: var(--ink); font-size: 16px; font-weight: 500; }
.strip { grid-column: 2 / 4; position: relative; height: 24px; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: 25% 100%; border-right: 1px solid var(--line); }
.strip::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--surface-2); }
.dot { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--accent); opacity: .5; }
.dot.me { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; }
.mean { position: absolute; top: 1px; bottom: 1px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
.who-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 18px; padding: 0 0 14px calc(2.1rem + 12px); }
.who-list div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.who-list b { font: 500 13px var(--font-mono); }
.who-list .me { color: var(--accent); }

/* Home */
a.btn { text-decoration: none; display: inline-block; }
.home-hero h2 { font-size: 28px; line-height: 1.15; letter-spacing: -0.01em; }
.lede { font-size: 16px; max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 32px; }
.fact b { display: block; font: 500 24px var(--font-mono); font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--ink-2); }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; max-width: 62ch; }

/* Prose (rules) */
.prose { display: grid; gap: 12px; max-width: 70ch; }
.prose h3 { margin-top: 8px; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.formula { font-family: var(--font-mono); background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }

/* Organizer */
.res-row { display: grid; grid-template-columns: 2.1rem minmax(0, 1fr); gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.res-row .fields { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.res-row input[type=url], .res-row input.note-in { flex: 1 1 180px; }
.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; z-index: 40; max-width: calc(100vw - 32px); font-weight: 500; }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1>Credence Challenge</h1>
        <p>100 propositions about 2027. Give each a probability.</p>
      </div>
      <div class="top-right">
        <span id="phase" class="pill">Loading</span>
      </div>
    </div>
    <div class="progress" id="progress" hidden>
      <div class="progress-row">
        <span class="ptext" id="ptext"></span>
        <button type="button" class="plink" id="pnext" hidden>Jump to next blank</button>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-label="Forecasts entered" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barfill"></i></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<div class="wrap">
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="view">
    <section id="v-home" hidden></section>
    <section id="v-rules" hidden></section>
    <section id="v-forecasts" hidden></section>
    <section id="v-standings" hidden></section>
    <section id="v-crowd" hidden></section>
    <section id="v-organizer" hidden></section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
const SECTIONS = [
  { id: 'us', title: 'US politics and world', kind: 'public' },
  { id: 'econ', title: 'Economy and markets', kind: 'public' },
  { id: 'tech', title: 'Tech and AI', kind: 'public' },
  { id: 'culture', title: 'Culture, sports, science, and nature', kind: 'public' },
  { id: 'personal', title: 'Personal', kind: 'personal',
    note: 'Answer about yourself. Other participants never see these, and they are left out of the crowd view. You report what actually happened in January 2028.' },
  { id: 'dept', title: 'Department', kind: 'dept',
    note: 'About the philosophy department. The organizer decides whether these appear in the crowd view.' },
  { id: 'meta', title: 'Meta', kind: 'meta',
    note: 'Scored at the end from your own results and your standing. Not shown in the crowd view.' }
];

const _Q = (id, sec, text, when) => ({ id, sec, text, when: when || '2027-12' });

const QUESTIONS = [
  // US politics and world
  _Q(1, 'us', 'Donald Trump is still president and JD Vance is still vice president on Dec 31, 2027.'),

const Scoring = (function () {
  // Forecasts are stored as whole percents (1-99) under keys like "q12".
  // A missing forecast counts as 50%. Probabilities are clipped to 1%-99%.
  function clip(x) { return Math.min(0.99, Math.max(0.01, x)); }
  function prob(v) { return (typeof v === 'number' && isFinite(v)) ? clip(v / 100) : 0.5; }
  const logS = (p, o) => Math.log(o ? p : 1 - p); // log score, higher is better

  // Outcome for one question and one person: 1, 0, or null (unresolved or void).
  function outcomeOf(q, res, doc) {
    if (q.kind === 'personal') {
      const v = doc.po && doc.po['q' + q.id];
      return (v === 0 || v === 1) ? v : null;
    }

    if (!r) return null;
    return (r.outcome === 0 || r.outcome === 1) ? r.outcome : null;
  }

  function items(doc, res, questions) {
    const out = [];
    for (const q of questions) {
      if (q.kind === 'meta') continue;
      const o = outcomeOf(q, res, doc);
      if (o === null) continue;
      const p = prob(doc.p && doc.p['q' + q.id]);
      out.push({ id: q.id, kind: q.kind, p, o, penalty: (p - o) * (p - o) });
    }
    return out;
  }

  function cmp(a, b) {
    if (a.brier === null && b.brier === null) return 0;
    if (a.brier === null) return 1;
    if (b.brier === null) return -1;
    if (Math.abs(a.brier - b.brier) > 1e-12) return a.brier - b.brier;
    if (Math.abs(a.log - b.log) > 1e-12) return a.log - b.log;
    if (Math.abs(a.peer - b.peer) > 1e-12) return b.peer - a.peer;
    return 0;
  }

  // docs: [{uid, name, p, po}]  res: {q12: {outcome: 1|0|'void'}}
  function standings(docs, res, questions) {
    const scored = questions.filter(q => q.kind !== 'meta');
    const publicQs = scored.filter(q => q.kind !== 'personal');
    const resolvedPublic = publicQs.filter(q => {
      const r = res['q' + q.id]; return r && (r.outcome === 0 || r.outcome === 1);
    });
    const rows = docs.map((d, i) => {
      const its = items(d, res, questions);
      const n = its.length;
      const brier = n ? its.reduce((s, x) => s + x.penalty, 0) / n : null;
      const log = n ? its.reduce((s, x) => s - logS(x.p, x.o), 0) / n : null;
      let peer = 0;
      if (docs.length > 1) {
        for (const q of resolvedPublic) {
          const o = res['q' + q.id].outcome;
          const mine = logS(prob(d.p && d.p['q' + q.id]), o);
          let sum = 0;
          docs.forEach((e, j) => { if (j !== i) sum += logS(prob(e.p && e.p['q' + q.id]), o); });
          peer += mine - sum / (docs.length - 1);
        }
      }
      return {
        uid: d.uid, name: d.name || 'Unnamed', n,
        nPersonal: its.filter(x => x.kind === 'personal').length,
        brier, log, peer, items: its
      };
    });
    rows.sort(cmp);
    rows.forEach((r, i) => { r.rank = (i > 0 && cmp(rows[i - 1], r) === 0) ? rows[i - 1].rank : i + 1; });
    return { rows, resolvedPublic: resolvedPublic.length, totalPublic: publicQs.length };
  }

  // Final meta outcomes. Assumptions (also shown in the organizer panel):
  //  top half = rank <= N/2; bottom 3 = rank > N-3;
  //  "beats the group average" compares Brier on resolved non-personal questions
  //  against the Brier of the mean forecast on those same questions.
  function metaOutcomes(st, docs, res, questions) {
    const N = st.rows.length;
    const byUid = new Map(docs.map(d => [d.uid, d]));
    const pub = questions.filter(q => q.kind !== 'meta' && q.kind !== 'personal' && outcomeOf(q, res, {}) !== null);
    const crowd = {};
    pub.forEach(q => {
      crowd[q.id] = docs.reduce((s, d) => s + prob(d.p && d.p['q' + q.id]), 0) / docs.length;
    });
    const metaQs = questions.filter(q => q.kind === 'meta');
    return st.rows.map(r => {
      const d = byUid.get(r.uid);
      let mine = 0, grp = 0;
      for (const q of pub) {

        grp += Math.pow(crowd[q.id] - o, 2);

      const out = {
        q94: r.rank <= N / 2 ? 1 : 0,
        q95: r.items.some(x => x.p >= 0.85 && x.o === 0) ? 1 : 0,
        q96: r.items.some(x => x.p <= 0.15 && x.o === 1) ? 1 : 0,
        q97: (r.brier !== null && r.brier < 0.25) ? 1 : 0,
        q98: (pub.length > 0 && mine < grp) ? 1 : 0,
        q99: r.rank === 1 ? 1 : 0,
        q100: r.rank > N - 3 ? 1 : 0

      const brier = metaQs.reduce((s, q) => s + Math.pow(prob(d.p && d.p['q' + q.id]) - out['q' + q.id], 2), 0) / metaQs.length;
      return { uid: r.uid, name: r.name, rank: r.rank, outcomes: out, brier };
    });

  return { clip, prob, items, standings, metaOutcomes };
})();


const Backup = (function () {
  // Builds the CSV that Drive converts into a Google Sheet.
  // One row per participant: name, id, last saved, Q1..Q100 forecasts, then the
  // outcomes each person reported for the personal questions.
  // Text cells that start with = + - @ or a control character get a leading
  // apostrophe so Sheets can never treat a participant's name as a formula.
  const risky = /^[=+\-@\t\r]/;
  function cell(v) {
    if (v === null || v === undefined) return '';

    if (typeof v === 'string' && risky.test(s)) s = "'" + s;

  }
  const line = a => a.map(cell).join(',');

  function csv(questions, docs) {
    const per = questions.filter(q => q.kind === 'personal');
    const head = ['Name', 'User ID', 'Last saved']
      .concat(questions.map(q => 'Q' + q.id), per.map(q => 'Outcome Q' + q.id));
    const qrow = ['Question text', '', '']
      .concat(questions.map(q => q.text), per.map(q => 'Outcome: ' + q.text));
    const rows = docs.slice()
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')))
      .map(d => {
        const p = d.p || {}, po = d.po || {};
        return [String(d.name || ''), d.uid, d.updatedAt || '']
          .concat(
            questions.map(q => (typeof p['q' + q.id] === 'number' ? p['q' + q.id] : '')),
            per.map(q => (po['q' + q.id] === 0 || po['q' + q.id] === 1 ? po['q' + q.id] : ''))

    return [line(head), line(qrow)].concat(rows.map(line)).join('\n') + '\n';

  return { csv, cell };

const FormImport = (function () {
  // Reads the CSV downloaded from the Google Form's response sheet.
  // Question columns are recognised by their leading number ("12. Friedrich Merz ...").
  function parseCsv(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  // Ids end up in public standings data, so they are a hash of the email, never the email itself.
  const slug = s => {
    s = String(s).toLowerCase().trim();
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
  };

  function parse(text, questions) {
    const rows = parseCsv(text).filter(r => r.some(c => String(c).trim() !== ''));
    if (rows.length < 2) return { error: 'The file has no responses.' };
    const head = rows[0].map(s => String(s).trim());
    const emailIx = head.findIndex(x => /^e-?mail( address)?$/i.test(x));
    const nameIx = head.findIndex(x => /^name$/i.test(x));
    const qIx = {};
    head.forEach((x, i) => {
      const m = /^(\d{1,3})\s*[.)]\s/.exec(x);
      if (m && questions.some(q => q.id === +m[1])) qIx[+m[1]] = i;
    });
    const matched = Object.keys(qIx).length;
    if (matched < Math.floor(questions.length / 2)) {
      return { error: 'Found ' + matched + ' question columns, expected about ' + questions.length + '. Download the form’s response sheet as a CSV and try again.' };
    }
    if (emailIx < 0 && nameIx < 0) return { error: 'The file needs an Email Address or a Name column.' };

    const byId = new Map(); let skippedRows = 0;
    for (const r of rows.slice(1)) {
      const email = emailIx >= 0 ? String(r[emailIx] || '').trim() : '';
      const name = nameIx >= 0 ? String(r[nameIx] || '').trim() : '';
      const key = email ? slug(email) : name ? 'n_' + slug(name) : '';
      if (!key) { skippedRows++; continue; }
      const p = {}, bad = [];
      for (const id in qIx) {
        const raw = String(r[qIx[id]] || '').trim();
        if (raw === '') continue;
        const m = /^(\d{1,2})\s*%?$/.exec(raw);
        const v = m ? +m[1] : NaN;
        if (v >= 1 && v <= 99) p['q' + id] = v; else bad.push(+id);
      }
      // a later row for the same person replaces an earlier one
      byId.set('f_' + key, { id: 'f_' + key, name: name || email.split('@')[0] || key, email, p, answered: Object.keys(p).length, bad });
    }
    return { people: [...byId.values()], matched, skippedRows };
  }
  return { parseCsv, parse };
})();

function qRow(q) {

  });

}

function scheduleSave() {

async function flush() {
  if (saving || !dirty || S.mineState !== 'ready' || !S.db || !S.uid) return;
  saving = true; dirty = false;
  try {
    await S.db.doc('forecasts/' + S.uid).set({ v: 1, name: (S.mine.name || '').trim(), p: S.mine.p, po: S.mine.po, updatedAt: new Date().toISOString() });

/* ---------- rules ---------- */
function renderRules() {
  const root = $('#v-rules');
  if (!root.dataset.built) {
    root.dataset.built = '1';
    const d = h('div', { class: 'card prose' });
    d.innerHTML = [
      '<h2>How scoring works</h2>',
      '<p>Each question asks for a probability between 1% and 99% that the proposition resolves YES. Forecasts outside that range are clipped to the nearest bound. Every question needs a forecast; a missing forecast is scored as 50%.</p>',
      '<p>For each question, take the difference between your forecast (as a decimal) and the outcome (1 if YES, 0 if NO), and square it. Your <b>Brier score</b> is the average of those squared differences across all scored questions. <b>Lower is better.</b> 0 is perfect, and answering 50% on everything scores exactly 0.25, which is the benchmark for beating chance.</p>',
      '<div class="formula">Brier = average of (forecast − outcome)²</div>',
      '<h3>Three examples</h3>',
      '<ul><li>You say 90% and it happens: (0.90 − 1)² = 0.01. If it doesn’t happen: (0.90 − 0)² = 0.81.</li>',
      '<li>You say 60% and it happens: (0.60 − 1)² = 0.16. If it doesn’t: (0.60 − 0)² = 0.36.</li>',
      '<li>Three questions with forecasts of 80%, 30% and 95%, and outcomes YES, NO, NO: 0.04, 0.09 and 0.9025 average to about 0.34. One overconfident miss outweighed two decent forecasts, by design.</li></ul>',
      '<h3>Why squares</h3>',
      '<p>Squaring makes penalties grow faster than errors do. Being a little wrong is cheap, and being very wrong is expensive. Missing by 0.2 costs 0.04, but missing by 0.4 costs 0.16, four times as much for twice the error. Confidence should be earned: if you truly believe something is 90% likely, say 90%.</p>',
      '<div class="tablewrap"><table><thead><tr><th>Size of miss</th><th>Example</th><th class="num">Penalty</th></tr></thead><tbody>',
      '<tr><td>Small</td><td>60% on something that happens</td><td class="num">0.16</td></tr>',
      '<tr><td>Medium</td><td>70% on something that doesn’t happen</td><td class="num">0.49</td></tr>',
      '<tr><td>Large</td><td>90% on something that doesn’t happen</td><td class="num">0.81</td></tr>',
      '<tr><td>Huge</td><td>99% on something that doesn’t happen</td><td class="num">0.98</td></tr></tbody></table></div>',
      '<p>Brier is also honest by design: your expected score is best when you report your true belief. Shading toward 50% to play it safe, or toward the extremes to look bold, both hurt you on average. Below 0.20 is solid on hard questions, and below 0.15 is excellent.</p>',
      '<h3>Scope</h3>',
      '<p>Rankings and the meta questions (94 to 100) are judged on questions 1 to 93 only. Meta questions are resolved after everything else is scored and are not part of the ranking. A question that resolves ambiguously, or whose resolution source ceases to exist, is voided and dropped for everyone. A question whose outcome is already determined when forecasts are submitted is voided.</p>',
      '<h3>Resolution</h3>',
      '<p>Each question resolves according to the source named in it, as of the stated date, or Dec 31, 2027 if none is given. Personal questions are answered by each participant about themselves and resolved on the honor system. Department questions refer to the department roster as of Jan 1, 2027. Disputes are settled by the organizer, whose decision is final.</p>',
      '<h3>Timing</h3>',
      '<p>Forecasts are due <b id="rules-deadline">by the deadline the organizer sets</b> and are locked once the organizer closes submissions. Forecasts are revealed to all participants after the deadline. Scoring takes place in January 2028, or once all questions have resolved.</p>',
      '<h3>Tiebreakers (don’t sweat this part)</h3>',
      '<p>Brier is the only score that decides the ranking. If two people tie, the log score breaks the tie (the average of −ln of the probability you assigned to what actually happened, which punishes confident misses more heavily), and then the peer score (how much better you did on each question than the group average, summed). You don’t need to understand or optimize for these. Forecast honestly and let the Brier score do its job.</p>'
    ].join('');
    root.append(d);
  }
  const c = S.config;
  $('#rules-deadline', root).textContent = c.deadline ? fmtDate(c.deadline) : 'by the deadline the organizer sets';
}

function confirmBtn(label, confirmLabel, onGo, cls) {
  let armed = false, t;
  const b = h('button', { type: 'button', class: cls || 'btn', text: label });
  b.addEventListener('click', async () => {
    if (!armed) { armed = true; b.textContent = confirmLabel; t = setTimeout(() => { armed = false; b.textContent = label; }, 5000); return; }
    clearTimeout(t); armed = false; b.disabled = true; b.textContent = 'Working…';
    try { await onGo(); } catch (e) { toast('Failed: ' + errMsg(e)); }
    b.disabled = false; b.textContent = label;

}
async function adminLoad() {
  const [f, l] = await Promise.all([S.db.collection('forecasts').get(), S.db.collection('locked').get()]);
  S.admin.forecasts = f.docs.map(d => ({ uid: d.id, ...clone(d.data()) }));
  S.admin.locked = l.docs.map(d => ({ uid: d.id, ...clone(d.data()) }));

async function saveConfig(patch) {

function scoringDocs() {
  const live = new Map(S.admin.forecasts.map(d => [d.uid, d]));
  const base = S.config.phase === 'open' ? S.admin.forecasts : S.admin.locked;
  return base.map(d => ({ uid: d.uid, name: d.name || 'Unnamed', p: d.p || {}, po: (live.get(d.uid) && live.get(d.uid).po) || d.po || {} }));

async function publishLeaderboard() {

  const st = Scoring.standings(docs, S.resolutions, QUESTIONS);
  const rows = st.rows.map(r => ({ uid: r.uid, name: r.name, rank: r.rank, brier: r.brier, log: r.log, peer: r.peer, n: r.n }));
  await S.db.doc('public/leaderboard').set({ rows, resolvedPublic: st.resolvedPublic, totalPublic: st.totalPublic, updatedAt: new Date().toISOString(), basis: S.config.phase === 'open' ? 'live' : 'locked' });

async function lockForecasts() {
  await adminLoad();
  const now = new Date().toISOString();
  for (const d of S.admin.forecasts) await S.db.doc('locked/' + d.uid).set({ name: d.name || '', p: d.p || {}, lockedAt: now });
  await saveConfig({ phase: 'locked', lockedAt: now });

}
async function revealForecasts(includeDept) {
  await adminLoad();
  const qids = QUESTIONS.filter(q => q.kind === 'public' || (q.kind === 'dept' && includeDept)).map(q => q.id);
  const keep = new Set(qids.map(i => 'q' + i));
  for (const d of S.admin.locked) {
    const p = {}; for (const k in (d.p || {})) if (keep.has(k)) p[k] = d.p[k];
    await S.db.doc('revealed/' + d.uid).set({ name: d.name || 'Anonymous', p });

  await saveConfig({ phase: 'revealed', crowdQids: qids, revealedAt: new Date().toISOString() });
  renderOrganizer(); toast('Forecasts revealed.');
}

function resolveRow(q) {

  sel.value = r ? String(r.outcome) : '';
  const date = h('input', { type: 'date', id: 'rd' + q.id, value: (r && r.date) || '', 'aria-label': 'Date resolved' });
  const src = h('input', { type: 'url', id: 'rs' + q.id, value: (r && r.source) || '', placeholder: 'Source link', 'aria-label': 'Source link' });
  const note = h('input', { type: 'text', class: 'note-in', id: 'rn' + q.id, value: (r && r.note) || '', placeholder: 'Note', 'aria-label': 'Note' });
  const status = h('span', { class: 'small muted', text: r ? 'Saved' : '' });
  const save = h('button', { type: 'button', class: 'btn', text: 'Save', onclick: async () => {
    save.disabled = true; status.textContent = 'Saving…';
    try {
      const v = sel.value, ref = S.db.doc('resolutions/q' + q.id);
      if (v === '') { await ref.delete(); delete S.resolutions['q' + q.id]; }
      else {
        const body = { outcome: v === 'void' ? 'void' : Number(v), date: date.value || today(), source: src.value.trim(), note: note.value.trim() };
        await ref.set(body); S.resolutions['q' + q.id] = body; if (!date.value) date.value = body.date;
      }

      try { await publishLeaderboard(); status.textContent = 'Saved and published'; }

    } catch (e) { status.textContent = 'Failed: ' + errMsg(e); }
    save.disabled = false;

  return h('div', { class: 'res-row' }, h('div', { class: 'qn', text: q.id }),

}

  return card('Import form responses',
    h('p', { text: 'In the form’s response sheet choose File, Download, Comma-separated values (.csv), then choose that file here. Do this before you lock submissions. Importing again replaces earlier imports for the same email.' }),
    h('p', { class: 'small muted', text: 'Already imported: ' + have + '. Imported forecasts are private until you reveal them.' }),
    file, out);
}

/* ---------- Drive backup (organizer only) ---------- */
const BK = { ready: null, busy: false, timer: null, lastSig: '', lastAt: 0 };
const BK_MIN_GAP = 15 * 60 * 1000;
const BK_STOP = ['needs_reauth', 'server_not_connected', 'selection_required', 'approval_required', 'not_in_manifest', 'consent_required', 'blocked_by_policy', 'unavailable'];
const sigOf = docs => docs.map(d => d.uid + ':' + (d.updatedAt || '')).sort().join('|');
function stamp(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function bkText() {
  const b = S.backup || {};
  if (BK.busy) return 'Backing up…';
  if (!b.lastAt) return 'No backup yet.';
  return 'Last backup ' + new Date(b.lastAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ', with ' + (b.lastCount || 0) + ' participants.';
}
function setBk(msg) { const el = $('#bk-status'); if (el) el.textContent = msg || bkText(); }
function bkError(e) {
  switch (e && e.code) {
    case 'needs_reauth': return 'Reconnect Google Drive in claude.ai Settings under Connectors, then try again.';
    case 'server_not_connected': case 'selection_required': return 'Add Google Drive in claude.ai Settings under Connectors, then try again.';
    case 'approval_required': case 'not_in_manifest': case 'consent_required': return 'Backups need your permission to use Google Drive. Click Back up now and choose Allow.';
    case 'blocked_by_policy': return 'Your organization blocks this Google Drive action.';
    case 'unavailable': return (e.message || 'Google Drive isn’t available in this view.') + ' Open the page in claude.ai while signed in.';
    default: return 'Backup failed: ' + errMsg(e);
  }
}
async function saveBk(patch) {
  S.backup = { ...(S.backup || {}), ...patch };
  await S.db.doc('admin/backup').set(S.backup);
}
async function runBackup(why) {
  if (BK.busy || !S.db) return false;
  BK.busy = true; setBk();
  let ok = false;
  try {
    const mcp = window.claude ? await window.claude.use('mcp') : null;
    if (!mcp) throw { code: 'unavailable', message: 'Google Drive isn’t available in this view.' };
    const snap = await S.db.collection('forecasts').get();
    const docs = snap.docs.map(d => ({ uid: d.id, ...clone(d.data()) }));
    if (why === 'auto' && !docs.length) { BK.busy = false; setBk(); return false; }
    const now = new Date();
    const input = { title: 'Credence Challenge backup ' + stamp(now), contentMimeType: 'text/csv', textContent: Backup.csv(QUESTIONS, docs) };
    if (S.backup && S.backup.folderId) input.parentId = S.backup.folderId;
    await mcp.callTool('Google Drive', 'create_file', input, { cache: false });
    BK.lastSig = sigOf(docs); BK.lastAt = now.getTime(); ok = true;
    try { await saveBk({ lastAt: now.toISOString(), lastSig: BK.lastSig, lastCount: docs.length }); } catch (e) { /* the file exists; this note is cosmetic */ }
    BK.busy = false; setBk();
    if (why === 'manual') toast('Backed up ' + docs.length + ' participants to Google Drive.');
  } catch (e) {
    BK.busy = false;
    const msg = bkError(e);
    setBk(msg);
    if (why === 'manual') toast(msg);
    if (why === 'auto' && e && BK_STOP.includes(e.code)) {
      try { await saveBk({ auto: false }); } catch (x) { /* ignore */ }
      const box = $('#bk-auto'); if (box) box.checked = false;
    }
  }
  BK.busy = false;
  return ok;
}
function maybeAuto(docs) {
  if (!(S.backup && S.backup.auto) || BK.timer) return;
  if (!docs.length || sigOf(docs) === BK.lastSig) return;
  const wait = Math.max(60000, BK.lastAt + BK_MIN_GAP - Date.now());
  BK.timer = setTimeout(() => { BK.timer = null; runBackup('auto'); }, wait);
}
async function initBackup() {
  try { const s = await S.db.doc('admin/backup').get(); S.backup = s.exists ? clone(s.data()) : {}; } catch (e) { S.backup = {}; }
  BK.lastSig = S.backup.lastSig || '';
  BK.lastAt = S.backup.lastAt ? Date.parse(S.backup.lastAt) : 0;
  S.db.collection('forecasts').onSnapshot(snap => {
    if (snap.metadata.fromCache) return;
    maybeAuto(snap.docs.map(d => ({ uid: d.id, ...clone(d.data()) })));
  }, () => { /* the participants table still loads on demand */ });
}
function backupCard() {
  const b = S.backup || {};
  const auto = h('input', { type: 'checkbox', id: 'bk-auto' });
  auto.checked = !!b.auto;
  auto.addEventListener('change', async () => {
    const on = auto.checked;
    try { await saveBk({ auto: on }); } catch (e) { toast('Failed: ' + errMsg(e)); auto.checked = !on; return; }
    if (on) {
      const ok = await runBackup('manual');
      if (!ok) { auto.checked = false; try { await saveBk({ auto: false }); } catch (e) { /* ignore */ } }
    } else { clearTimeout(BK.timer); BK.timer = null; }
  });
  const folder = b.folderId ? h('a', { href: 'https://drive.google.com/drive/folders/' + encodeURIComponent(b.folderId), target: '_blank', rel: 'noopener noreferrer', text: 'Open backup folder' }) : null;
  return card('Backup to Google Drive',
    h('p', { text: 'Saves every participant’s forecasts as a new Google Sheet in your Drive, one row per person. Each backup is its own file, so earlier ones are never overwritten. Participants never see this.' }),
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', text: 'Back up now', onclick: () => runBackup('manual') }), folder),
    h('div', { class: 'row' }, auto, h('label', { for: 'bk-auto', text: 'Back up automatically while this page is open' })),
    h('p', { class: 'small muted', text: 'Automatic backups run after forecasts change, at most once every 15 minutes, and only while this page is open in your browser. Use Back up now before you close it.' }),
    h('p', { class: 'small', id: 'bk-status', text: bkText() }));
}

/* ---------- data wiring ---------- */
function onData() {
  renderHeader(); applyFormState(); renderHome(); renderStandings(); renderCrowd(); renderRules(); updateBanner();
}
function sub(ref, apply) {
  return ref.onSnapshot(snap => {
    if (!snap.metadata.fromCache) { S.connected = true; S.notes.conn = ''; }
    apply(snap); onData();
  }, e => { S.notes.conn = 'Live updates stopped (' + ((e && e.code) || 'error') + '). Reload the page to reconnect.'; updateBanner(); });
}

async function boot() {
  buildForecastView(); renderHome(); renderRules(); renderStandings(); renderCrowd(); renderHeader();
  $('#pnext').addEventListener('click', goNextBlank);
  window.addEventListener('hashchange', route); route();
  if (STATIC) {
    const D = window.__STATIC__;
    S.config = { ...DEFAULT_CONFIG, ...(D.config || {}), formUrl: '' };
    S.resolutions = D.resolutions || {}; S.leaderboard = D.leaderboard || null; S.meta = D.meta || null; S.revealed = D.revealed || [];
    S.mineState = 'unavailable'; S.connected = true;
    renderTabs(); route(); renderHome(); renderRules(); renderStandings(); renderCrowd(); renderHeader();
    return;
  }
  const cl = window.claude;
  let db = null, user = null;
  try { [db, user] = await Promise.all([cl ? cl.use('db') : null, cl ? cl.use('user') : null]); } catch (e) { /* fall through */ }
  if (user) {
    try {
      S.uid = await user.id(); S.isAdmin = await user.isOwner(); S.canWrite = await user.can('data.write');
      S.myName = ((await user.me()).name) || '';
    } catch (e) { /* keep defaults */ }
  }
  renderTabs(); route();
  S.db = db;
  if (db && S.isAdmin && location.hash === '#organizer') route();
  if (!db) {
    S.mineState = 'unavailable';
    S.notes.access = 'This view can’t reach the database, so forecasts can’t be saved here. Open the page from the shared link while signed in.';
    onData(); return;
  }
  if (!S.uid || S.canWrite === false) S.mineState = 'unavailable';

  setTimeout(() => { if (!S.connected) { S.notes.conn = 'Still trying to reach the database. Anything you enter will save when the connection returns.'; updateBanner(); } }, 10000);
  sub(db.doc('config/main'), s => { S.config = { ...DEFAULT_CONFIG, ...(s.exists ? clone(s.data()) : {}) }; });
  sub(db.collection('resolutions'), s => { S.resolutions = {}; s.docs.forEach(d => { S.resolutions[d.id] = clone(d.data()); }); });
  sub(db.doc('public/leaderboard'), s => { S.leaderboard = s.exists ? clone(s.data()) : null; });
  sub(db.doc('public/meta'), s => { S.meta = s.exists ? clone(s.data()) : null; });
  sub(db.collection('revealed'), s => { S.revealed = s.docs.map(d => ({ uid: d.id, ...clone(d.data()) })); });
  if (S.isAdmin && !window.__HOSTED__) BK.ready = initBackup();

  if (S.uid && S.canWrite !== false) {
    try {
      const snap = await db.doc('forecasts/' + S.uid).get();
      const d = snap.exists ? clone(snap.data()) : {};
      S.mine = { name: d.name || S.myName || '', p: d.p || {}, po: d.po || {} };
      S.mineState = 'ready';
      hydrateForm(); renderStandings(); renderHome();
    } catch (e) {
      S.mineState = 'unavailable';
      S.notes.access = 'Couldn’t load your saved forecasts (' + errMsg(e) + '). Editing is off so nothing gets overwritten. Reload to try again.';
      applyFormState(); updateBanner();
    }
  } else { applyFormState(); updateBanner(); }
}
boot();
})();
</script>
